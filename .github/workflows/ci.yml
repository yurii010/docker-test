name: CI

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs: 
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build Docker images
        run: docker compose build

      - name: Tag Docker images
        run: |
          docker tag docker-task-manager-frontend:latest ghcr.io/yurii010/docker-task-manager-frontend:latest
          docker tag docker-task-manager-backend:latest ghcr.io/yurii010/docker-task-manager-backend:latest

      - name: Push Docker images
        run: |
          docker push ghcr.io/yurii010/docker-task-manager-frontend:latest
          docker push ghcr.io/yurii010/docker-task-manager-backend:latest
  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy to EC2
        run: |
          ssh -i ~/.ssh/deploy_key \
            "${{ vars.EC2_USER }}@${{ vars.EC2_HOST }}" \
            "cd ~/docker-task-manager && \
             docker compose -f compose.staging.yml pull && \
             docker compose -f compose.staging.yml up -d"