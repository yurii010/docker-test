name: CI

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs: 
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build Docker images
        run: docker compose build

      - name: Tag Docker images
        run: |
          docker tag docker-task-manager-frontend:latest ghcr.io/yurii010/docker-task-manager-frontend:latest
          docker tag docker-task-manager-backend:latest ghcr.io/yurii010/docker-task-manager-backend:latest